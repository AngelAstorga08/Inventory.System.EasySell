name: Backend build

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'Inventory.System.Backend/**'
      - '.github/workflows/backend-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore Inventory.System.Backend/Inventory.System.Backend.slnx
      - name: Build backend
        run: dotnet build Inventory.System.Backend/Inventory.System.Backend.slnx --configuration Release --no-restore
